spring:
  application:
    name: hearth-kitchen
  datasource:
    url: jdbc:postgresql://localhost:5432/hearth
    username: hearth
    password: hearth
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
